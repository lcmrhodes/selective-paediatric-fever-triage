name: Deploy approved GitHub Pages release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish the validated main-branch release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the approved release
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Restore the R environment
        run: Rscript tools/restore_environment.R

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false

      - name: Install browser build dependencies
        run: npm ci

      - name: Regenerate and verify reference artifacts
        run: |
          npm run export:model
          Rscript tools/write_browser_parity_reference.R
          node scripts/check-model-bundle.mjs --write
          git diff --exit-code -- models/browser_model_bundle.json models/model_bundle_manifest.json tests/fixtures/browser_parity_reference.json

      - name: Run the complete validated test suite
        run: |
          Rscript tests/testthat.R
          npm run test:all
          bash tools/check_repository.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static application only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the validated static application
        id: deployment
        uses: actions/deploy-pages@v4
